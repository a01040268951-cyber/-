name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        run: |
          set -o pipefail
          ./gradlew build --no-configuration-cache --stacktrace 2>&1 | tee build.log || {
            # 로그를 annotation으로 남김 (원격에서 읽기 위함)
            grep -nE "error:|warning:.*deprecat|What went wrong|Could not|Caused by|\.java:[0-9]+|FAILURE|symbol|location" build.log | head -60 > errs.txt || true
            python3 - <<'PY'
          import urllib.parse
          lines = open('errs.txt', encoding='utf-8', errors='replace').read().splitlines()
          for i in range(0, len(lines), 12):
              chunk = "\n".join(lines[i:i+12]).replace('%','%25').replace('\r','').replace('\n','%0A')
              print(f"::error title=build-log-{i//12}::{chunk}")
          PY
            tail -40 build.log | python3 -c "import sys; d=sys.stdin.read().replace('%','%25').replace('\n','%0A'); print('::error title=build-tail::'+d)"
            exit 1
          }

      - name: Dump Minecraft API (debug)
        if: always()
        run: |
          J=$(find build ~/.gradle -name "*.jar" 2>/dev/null | xargs -I{} sh -c 'unzip -l "{}" 2>/dev/null | grep -q "net/minecraft/advancements/DisplayInfo.class" && echo "{}"' | head -1)
          echo "jar=$J"
          for c in net.minecraft.advancements.DisplayInfo net.minecraft.advancements.AdvancementType; do
            javap -cp "$J" -public $c | grep -v "^Compiled" | tr '\n' '|' | sed 's/%/%25/g' | sed 's/|/%0A/g' | sed "s/^/::warning title=api-$c::/"; echo
          done

      - name: Show jar contents
        run: unzip -l build/libs/*.jar

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: tabooword-jar
          path: build/libs/*.jar
          if-no-files-found: error

      # Whisper 모델별 정확도·속도 비교 (모드와 같은 파이프라인)
      - name: Whisper smoke test
        if: ${{ !contains(github.event.head_commit.message, '[skip-voice]') }}
        continue-on-error: true
        run: |
          set -e
          mkdir -p /tmp/st && cd /tmp/st
          curl -sSfL -o whisper-jni.jar https://repo1.maven.org/maven2/io/github/givimad/whisper-jni/1.7.1/whisper-jni-1.7.1.jar
          for m in small-q5_1; do
            curl -sSfL -o ggml-$m.bin https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-$m.bin
          done
          ls -la *.bin | tee -a $GITHUB_WORKSPACE/smoke.log
          which ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
          pip install -q gTTS
          i=0; files=""
          while IFS= read -r line; do
            i=$((i+1)); gtts-cli "$line" -l ko -o s$i.mp3 </dev/null
            ffmpeg -nostdin -loglevel error -y -i s$i.mp3 -ar 16000 -ac 1 -sample_fmt s16 s$i.wav
            # 마이크처럼: 소리 작게 + 잡음
            ffmpeg -nostdin -loglevel error -y -i s$i.wav -f lavfi -i "anoisesrc=c=pink:a=0.05" \
              -filter_complex "[0]volume=0.3[a];[a][1]amix=inputs=2:duration=first:normalize=0" -ar 16000 -ac 1 -sample_fmt s16 s${i}_n.wav
            echo "s$i.wav = $line" >> $GITHUB_WORKSPACE/smoke.log; files="$files s$i.wav s${i}_n.wav"
          done <<'EOS'
          안녕하세요 반갑습니다
          감사합니다
          나는 바보다
          빨리 가자
          저기 봐 크리퍼다
          다 같이 가자
          너 뭐 하니
          나 지금 집에 가
          다이아 캐러 가자
          아 진짜 미치겠다
          저기 크리퍼 터진다 빨리 피해
          철 좀 나눠 줘
          내가 먼저 갈게
          집 짓자 나무 캐 와
          배고파 빵 먹자
          그거 내 거야
          EOS
          ffmpeg -nostdin -loglevel error -y -f lavfi -i "anoisesrc=d=4:c=pink:a=0.05" -ar 16000 -ac 1 -sample_fmt s16 noise.wav
          echo "noise.wav = " >> $GITHUB_WORKSPACE/smoke.log
          echo "nproc=$(nproc)" >> $GITHUB_WORKSPACE/smoke.log
          # 빠른 엔진: 모드와 같은 주소에서 실행 파일·모델을 받는다
          SV=v1.13.3; SM=sherpa-onnx-streaming-zipformer-korean-2024-06-16
          curl -sSfL -o native.jar https://github.com/k2-fsa/sherpa-onnx/releases/download/$SV/sherpa-onnx-native-lib-linux-x64-$SV.jar
          mkdir -p nat && (cd nat && unzip -oq ../native.jar)
          mkdir -p $SM
          for f in encoder-epoch-99-avg-1.int8.onnx decoder-epoch-99-avg-1.int8.onnx joiner-epoch-99-avg-1.int8.onnx tokens.txt; do
            curl -sSfL -o $SM/$f https://huggingface.co/k2-fsa/$SM/resolve/main/$f && echo "HF k2-fsa OK $f" >> $GITHUB_WORKSPACE/smoke.log \
              || { curl -sSfL -o $SM/$f https://huggingface.co/csukuangfj/$SM/resolve/main/$f && echo "HF csukuangfj OK $f" >> $GITHUB_WORKSPACE/smoke.log; } \
              || echo "HF FAIL $f" >> $GITHUB_WORKSPACE/smoke.log
          done
          ls -la $SM >> $GITHUB_WORKSPACE/smoke.log
          echo "=== streaming(fast)" >> $GITHUB_WORKSPACE/smoke.log
          java -Dsherpa_onnx.native.path=$PWD/nat/sherpa-onnx/native/linux-x64 \
            -cp "$GITHUB_WORKSPACE/libs/sherpa-onnx-v1.13.3.jar:$GITHUB_WORKSPACE/build/classes/java/main" \
            "$GITHUB_WORKSPACE/tools/StreamSmokeTest.java" $SM 2 $files noise.wav 2>&1 >> $GITHUB_WORKSPACE/smoke.log || echo "stream test failed" >> $GITHUB_WORKSPACE/smoke.log
          P="마인크래프트 하면서 친구들과 나누는 대화."
          for cfg in "small-q5_1|"; do
            m=${cfg%%|*}; prompt=${cfg#*|}; echo "=== $m prompt=[${prompt}]" | tee -a $GITHUB_WORKSPACE/smoke.log
            java -Dtabooword.prompt="$prompt" -cp "whisper-jni.jar:$GITHUB_WORKSPACE/build/classes/java/main" \
              "$GITHUB_WORKSPACE/tools/WhisperSmokeTest.java" ggml-$m.bin 3 $files noise.wav 2>&1 | grep -v "^whisper_\|^ggml_\|^\s*$" >> $GITHUB_WORKSPACE/smoke.log
          done
          python3 $GITHUB_WORKSPACE/tools/summarize.py $GITHUB_WORKSPACE/smoke.log | tee $GITHUB_WORKSPACE/summary.txt

      # 결과물을 taboo-mod-dist 브랜치에 커밋 (아티팩트 대신 git으로 받기 위함)
      - name: Publish jar to dist branch
        if: github.ref == 'refs/heads/taboo-mod'
        run: |
          mkdir -p /tmp/dist && cp build/libs/*.jar /tmp/dist/
          [ -f smoke.log ] && cp smoke.log /tmp/dist/ || echo "no smoke log" > /tmp/dist/smoke.log
          [ -f summary.txt ] && cp summary.txt /tmp/dist/ || true
          unzip -l build/libs/*.jar > /tmp/dist/jar-contents.txt
          cd /tmp/dist
          git init -q -b taboo-mod-dist
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -qm "build ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" taboo-mod-dist
