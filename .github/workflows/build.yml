name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        run: |
          set -o pipefail
          ./gradlew build --no-configuration-cache --stacktrace 2>&1 | tee build.log || {
            # 로그를 annotation으로 남김 (원격에서 읽기 위함)
            grep -nE "error:|warning:.*deprecat|What went wrong|Could not|Caused by|\.java:[0-9]+|FAILURE|symbol|location" build.log | head -60 > errs.txt || true
            python3 - <<'PY'
          import urllib.parse
          lines = open('errs.txt', encoding='utf-8', errors='replace').read().splitlines()
          for i in range(0, len(lines), 12):
              chunk = "\n".join(lines[i:i+12]).replace('%','%25').replace('\r','').replace('\n','%0A')
              print(f"::error title=build-log-{i//12}::{chunk}")
          PY
            tail -40 build.log | python3 -c "import sys; d=sys.stdin.read().replace('%','%25').replace('\n','%0A'); print('::error title=build-tail::'+d)"
            exit 1
          }

      - name: Show jar contents
        run: unzip -l build/libs/*.jar

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: tabooword-jar
          path: build/libs/*.jar
          if-no-files-found: error

      # 한국어 음성 → Vosk 인식 → ㅇ 판정이 실제로 되는지 확인 (마이크 대신 TTS 음성 파일 사용)
      - name: Voice recognition smoke test
        continue-on-error: true
        run: |
          set -e
          mkdir -p /tmp/st && cd /tmp/st
          curl -sSfL -o vosk.jar https://repo1.maven.org/maven2/com/alphacephei/vosk/0.3.45/vosk-0.3.45.jar
          curl -sSfL -o jna.jar https://repo1.maven.org/maven2/net/java/dev/jna/jna/5.13.0/jna-5.13.0.jar
          echo "--- natives in vosk.jar"; unzip -l vosk.jar | grep -E "\.(so|dll|dylib)$" || true
          curl -sSfL -o model.zip https://alphacephei.com/vosk/models/vosk-model-small-ko-0.22.zip
          unzip -q model.zip
          which ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
          pip install -q gTTS
          i=0; files=""
          while IFS= read -r line; do
            i=$((i+1)); gtts-cli "$line" -l ko -o s$i.mp3 </dev/null
            ffmpeg -nostdin -loglevel error -y -i s$i.mp3 -ar 16000 -ac 1 -sample_fmt s16 s$i.wav
            echo "s$i.wav = $line" >> $GITHUB_WORKSPACE/smoke.log; files="$files s$i.wav"
          done <<'EOS'
          안녕하세요 반갑습니다
          오늘 날씨가 좋네요
          감사합니다
          나는 바보다
          빨리 가자
          저기 봐 크리퍼다
          다 같이 가자
          너 뭐 하니
          EOS
          java -cp "vosk.jar:jna.jar:$GITHUB_WORKSPACE/build/classes/java/main" \
            "$GITHUB_WORKSPACE/tools/VoskSmokeTest.java" vosk-model-small-ko-0.22 $files 2>&1 | tee -a $GITHUB_WORKSPACE/smoke.log

      # 결과물을 taboo-mod-dist 브랜치에 커밋 (아티팩트 대신 git으로 받기 위함)
      - name: Publish jar to dist branch
        if: github.ref == 'refs/heads/taboo-mod'
        run: |
          mkdir -p /tmp/dist && cp build/libs/*.jar /tmp/dist/
          [ -f smoke.log ] && cp smoke.log /tmp/dist/ || echo "no smoke log" > /tmp/dist/smoke.log
          unzip -l build/libs/*.jar > /tmp/dist/jar-contents.txt
          cd /tmp/dist
          git init -q -b taboo-mod-dist
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -qm "build ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" taboo-mod-dist
